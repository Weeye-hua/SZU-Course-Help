name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write

    steps:
      - name: Cancel older builds of the same release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh api "repos/${GH_REPO}/actions/workflows/release.yml/runs?per_page=100" \
            | jq --arg tag "${RELEASE_TAG}" --argjson current "${RELEASE_RUN_ID}" \
              '.workflow_runs[] | select(.head_branch == $tag and .id < $current and .status != "completed") | .id' \
            > older-release-runs.txt
          while IFS= read -r run_id; do
            echo "Cancelling superseded release run ${run_id}"
            if ! gh api --method POST "repos/${GH_REPO}/actions/runs/${run_id}/cancel"; then
              state=$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" --jq '.status')
              [ "${state}" = "completed" ] || exit 1
            fi
          done < older-release-runs.txt

      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Validate source and OCR runtime
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q .
          node --check static_dist/login.js
          node --check static_dist/course-app.js
          node --check static_dist/offline.js
          node --check static_dist/schedule-parser.js
          python -c "import logic; ready, message = logic.check_ocr_runtime(); assert ready, message"
          python -m pytest -q

  native-build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-22.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux binary tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Smoke-test OCR engine initialization
        run: python -c "import logic; detector, recognizer = logic._ddddocr_engines(); assert callable(detector.predict) and callable(recognizer.predict)"

      - name: Build native release package
        run: python scripts/build_release.py

      - name: Smoke-test both study programs
        run: python scripts/check_release_startup.py release

      - name: Smoke-test child process env isolation
        if: runner.os == 'Linux'
        run: python scripts/check_release_child_env.py release

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  source-build:
    name: Build source archive
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build source package
        run: python scripts/package_source.py

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [native-build, source-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_commit=$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)
          if [ -z "${tag_commit}" ]; then
            tag_commit=$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
          fi
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "Release tag moved; refusing to publish stale artifacts"
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "SZU Course Help ${GITHUB_REF_NAME}" \
              --notes-file docs/RELEASE_NOTES.md
            for asset in $(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name | select(. == "SHA256SUMS.txt" or endswith(".sha256"))'); do
              gh release delete-asset "${GITHUB_REF_NAME}" "${asset}" --yes
            done
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/*.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/*.zip \
              --verify-tag \
              --title "SZU Course Help ${GITHUB_REF_NAME}" \
              --notes-file docs/RELEASE_NOTES.md
          fi
