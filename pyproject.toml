[project]
name = "szu-course-select"
version = "3.7.1"
description = "Local WebUI helper for Shenzhen University course selection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "requests>=2.32.5",
    "chardet>=5.0.0,<6",
    "pycryptodome>=3.23.0",
    "ddddocr>=1.6.1,<1.7",
    "opencv-python>=4.10.0",
    "onnxruntime>=1.20.0",
]

[project.optional-dependencies]
paddle = [
    "paddleocr>=3.4.0",
    "paddlepaddle>=3.1.1",
]
build = [
    "nuitka>=2.8.9",
    "zstandard>=0.25.0",
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.0,<1",
]

[project.scripts]
course-select = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["security", "services", "static_dist"]
py-modules = [
    "app",
    "card_key",
    "campus",
    "choose_course",
    "config",
    "course_list",
    "course_models",
    "cus_base64",
    "database",
    "desencode",
    "generate_card_key",
    "logging_config",
    "logic",
    "main",
    "project_paths",
    "school_password",
    "school_session",
    "study_program",
]

[tool.setuptools.package-data]
static_dist = ["*.avif", "*.css", "*.html", "*.ico", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    "build",
    "CourseEnroll",
    "desencode.py",
    "cus_base64.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
